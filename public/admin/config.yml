backend:
  name: github
  repo: dmitry-tiunov/tiunov.top
  branch: main

locale: ru
media_folder: public/img
public_folder: /img

collections:
  - name: blog
    label: Блог
    label_singular: Статья
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Заголовок (title)", widget: string }
      - { name: description, label: "Описание для поиска", widget: text }
      - { name: date, label: Дата, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: draft, label: Черновик, widget: boolean, default: true }
      - { name: body, label: Текст, widget: markdown }

  - name: cases
    label: Кейсы
    label_singular: Кейс
    folder: src/content/cases
    create: true
    slug: "{{slug}}"
    identifier_field: client
    summary: "{{client}}"
    thumbnail: cover
    fields:
      - { name: client, label: Клиент, widget: string }
      - { name: title, label: "Заголовок (title)", widget: string }
      - { name: description, label: "Описание для поиска", widget: text }
      - { name: summary, label: "Коротко для карточки", widget: text }
      - { name: tags, label: Теги, widget: list }
      - { name: cover, label: Обложка, widget: image, required: false }
      - { name: gallery, label: Галерея, widget: list, field: { name: image, label: Картинка, widget: image }, required: false }
      - { name: order, label: "Порядок (запасной, если кейса нет в списке «Порядок кейсов»)", widget: number, default: 100, required: false }
      - { name: draft, label: Черновик, widget: boolean, default: false }
      - { name: body, label: Текст, widget: markdown }

  - name: cities
    label: Города
    label_singular: Город
    folder: src/content/cities
    create: true
    slug: "{{slug}}"
    fields:
      - { name: city, label: Город, widget: string }
      - { name: cityIn, label: "Город в падеже («в Москве»)", widget: string }
      - { name: title, label: "Заголовок (title)", widget: string }
      - { name: description, label: "Описание для поиска", widget: text }
      - { name: draft, label: Черновик, widget: boolean, default: true }
      - { name: body, label: "Уникальный текст страницы", widget: markdown }

  - name: settings
    label: Настройки
    files:
      - name: cases-order
        label: Порядок кейсов
        file: src/data/cases-order.json
        fields:
          - name: cases
            label: "Кейсы по порядку (перетаскивайте карточки, новый кейс добавьте кнопкой «Добавить»)"
            widget: list
            field: { name: slug, label: Кейс, widget: relation, collection: cases, value_field: "{{slug}}", search_fields: [client], display_fields: [client] }
      - name: about
        label: Страница «Обо мне»
        file: src/data/about.json
        fields:
          - { name: seoTitle, label: "SEO: заголовок", widget: string }
          - { name: seoDescription, label: "SEO: описание", widget: text }
          - { name: title, label: Имя, widget: string }
          - { name: lead, label: Вступление, widget: text }
          - { name: text, label: Абзацы, widget: list, field: { name: p, label: Абзац, widget: text } }
          - { name: stats, label: Цифры, widget: list, fields: [ { name: value, label: Число, widget: string }, { name: label, label: Подпись, widget: string } ] }
          - { name: path, label: Путь, widget: list, summary: "{{year}} {{title}}", fields: [ { name: year, label: Год, widget: string }, { name: title, label: Заголовок, widget: string }, { name: text, label: Текст, widget: text } ] }
          - { name: skills, label: Что делаю, widget: list, summary: "{{title}}", fields: [ { name: title, label: Заголовок, widget: string }, { name: text, label: Текст, widget: text } ] }
          - { name: principles, label: Принципы, widget: list, summary: "{{title}}", fields: [ { name: title, label: Заголовок, widget: string }, { name: text, label: Текст, widget: text } ] }
      - name: site
        label: Контакты и пакеты
        file: src/data/site.json
        fields:
          - { name: name, label: Название студии, widget: string }
          - { name: city, label: Город, widget: string }
          - { name: phone, label: Телефон, widget: string }
          - { name: telegram, label: "Telegram (без @)", widget: string }
          - { name: email, label: Почта, widget: string }
          - { name: behance, label: "Ссылка на Behance", widget: string, required: false }
          - { name: dprofile, label: "Ссылка на Dprofile", widget: string, required: false }
          - { name: cvUrl, label: "Файл CV (PDF)", widget: file, required: false }
          - { name: portfolioUrl, label: "Файл портфолио (PDF)", widget: file, required: false }
          - { name: metrikaId, label: "Номер счётчика Яндекс Метрики", widget: string, required: false }
          - { name: yandexVerification, label: "Код подтверждения Яндекс Вебмастера (content из meta-тега)", widget: string, required: false }
          - { name: googleVerification, label: "Код подтверждения Google Search Console (content из meta-тега)", widget: string, required: false }
          - { name: formEmbed, label: "Ссылка на Яндекс Форму (https://forms.yandex.ru/u/…/)", widget: string, required: false }
          - { name: formEndpoint, label: "Адрес отправки формы", widget: string, required: false }
          - name: packages
            label: Пакеты
            widget: list
            fields:
              - { name: label, label: Метка, widget: string }
              - { name: title, label: Название, widget: string }
              - { name: price, label: "Цена (например «от 45 000»)", widget: string }
              - { name: term, label: Срок, widget: string }
              - { name: featured, label: Выделить, widget: boolean, default: false }
              - { name: items, label: Состав, widget: list }
      - name: home
        label: Главная страница
        file: src/data/home.json
        fields:
          - { name: seoTitle, label: "Заголовок для поиска (title)", widget: string }
          - { name: seoDescription, label: "Описание для поиска", widget: text }
          - name: hero
            label: Первый экран
            widget: object
            fields:
              - { name: badgeTag, label: "Бейдж: метка", widget: string }
              - { name: badgeText, label: "Бейдж: текст", widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: lead, label: Подзаголовок, widget: text }
              - { name: primary, label: "Белая кнопка", widget: string }
              - { name: secondary, label: "Тёмная кнопка", widget: string }
          - { name: logosTitle, label: "Заголовок над логотипами", widget: string }
          - name: logos
            label: "Логотипы клиентов (белые PNG на прозрачном фоне)"
            widget: list
            fields:
              - { name: name, label: Название, widget: string }
              - { name: image, label: Логотип, widget: image }
          - name: services
            label: Услуги
            widget: object
            fields:
              - { name: pill, label: Метка, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Подзаголовок, widget: text }
              - name: items
                label: Блоки услуг
                widget: list
                fields:
                  - { name: label, label: Метка, widget: string }
                  - { name: title, label: Заголовок, widget: string }
                  - { name: text, label: Текст, widget: text }
                  - { name: bullets, label: Пункты, widget: list, required: false }
                  - { name: linkText, label: "Текст ссылки", widget: string, required: false }
                  - { name: linkUrl, label: "Адрес ссылки", widget: string, required: false }
                  - { name: images, label: "Картинки (1 или 2; для макета сайта 3)", widget: list, field: { name: image, label: Картинка, widget: image } }
                  - { name: browser, label: "Показать как макет сайта", widget: boolean, default: false }
                  - { name: browserTitle, label: "Заголовок в макете сайта", widget: string, required: false }
          - { name: casesTitle, label: "Кейсы: заголовок", widget: string }
          - { name: casesText, label: "Кейсы: подзаголовок", widget: text }
          - { name: gallery, label: "Витрина работ под кейсами", widget: list, field: { name: image, label: Картинка, widget: image } }
          - name: about
            label: Обо мне
            widget: object
            fields:
              - { name: pill, label: Метка, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: photo, label: Фото, widget: image }
              - { name: text, label: "Абзацы", widget: list, field: { name: p, label: Абзац, widget: text } }
          - { name: stepsTitle, label: "Этапы: заголовок", widget: string }
          - name: steps
            label: Этапы
            widget: list
            fields:
              - { name: title, label: Этап, widget: string }
              - { name: text, label: Описание, widget: text }
          - name: faq
            label: Вопросы
            widget: list
            fields:
              - { name: q, label: Вопрос, widget: string }
              - { name: a, label: Ответ, widget: text }
          - name: final
            label: Финальный призыв
            widget: object
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: text }
              - { name: chips, label: "Кнопки-подсказки", widget: list }
